# Edit optional item icons here. Remove any :icon: token to hide it.
# Unsupported servers, older Java clients, and Bedrock players automatically receive clean text without item sprites.

tokens:
  prefix: ":hopper: {theme}FoAutoCollect &8» {muted}"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  yellow: "#ffd966"
  good: "#3ecf8e"
  bad: "#ff5d73"

messages:
  no-permission: "{prefix}:redstone: {bad}You don't have permission."
  players-only: "{prefix}:redstone: {bad}Only players can run this command."
  unknown-subcommand: "{prefix}:redstone: {bad}Unknown subcommand: {theme}{arg}{bad}."

  toggle-enabled: "{prefix}:lime_dye: {good}Auto collect enabled."
  toggle-disabled: "{prefix}:red_dye: {bad}Auto collect disabled."
  toggle-forced: "{prefix}:lime_dye: {muted}Auto collect is forced {good}enabled {muted}for everyone."
  status-enabled: "{prefix}:lime_dye: {muted}Auto collect is {good}enabled{muted}."
  status-disabled: "{prefix}:red_dye: {muted}Auto collect is {bad}disabled{muted}."

  help-header: "{prefix}:book: {muted}Available commands:"
  help-version: "{prefix}{theme}/foautocollectadmin version {muted}- check for updates"
  help-reload: "{prefix}{theme}/foautocollectadmin reload {muted}- reload config and messages"
  help-editor: "{prefix}{theme}/foautocollectadmin editor {muted}- open editor GUI"
  help-set: "{prefix}{theme}/foautocollectadmin set <player> <on|off> {muted}- set a player's session state"
  help-force: "{prefix}{theme}/foautocollectadmin force <on|off|status> {muted}- control forced auto collect"

  reloaded: "{prefix}:emerald: {good}Reloaded config and messages."
  player-not-found: "{prefix}:redstone: {bad}That player is not online."
  admin-set-enabled: "{prefix}:lime_dye: {good}Set {theme}{player}{good}'s auto collect to enabled."
  admin-set-disabled: "{prefix}:red_dye: {bad}Set {theme}{player}{bad}'s auto collect to disabled."
  admin-force-state: "{prefix}:book: {muted}Force enabled is {state}{muted}."
  admin-force-usage: "{prefix}:book: {muted}Use {theme}/foautocollectadmin force on {muted}or {theme}off {muted}to toggle it."
  admin-force-enabled: "{prefix}:lime_dye: {good}Forced auto collect is now enabled for everyone."
  admin-force-disabled: "{prefix}:red_dye: {bad}Forced auto collect is now disabled."
  invalid-state: "{prefix}:redstone: {bad}Use {theme}on {bad}or {theme}off{bad}."
  invalid-force-state: "{prefix}:redstone: {bad}Use {theme}on{bad}, {theme}off{bad}, or {theme}status{bad}."
  command-missing: "{prefix}:redstone: {bad}Command is missing from plugin.yml: {theme}{command}"
  command-failed: "{prefix}:redstone: {bad}Command failed. {muted}{error}"
  inventory-full-actionbar: ":chest: {bad}Inventory full."

  editor-saved: "{prefix}:emerald: {good}Saved {theme}{setting}{good}."
  editor-added: "{prefix}:emerald: {good}Added {theme}%material_sprite%%material%{good}."
  editor-removed: "{prefix}:redstone: {bad}Removed {theme}%material_sprite%%material%{bad}."
  prompt-cancelled: "{prefix}:redstone: {bad}Input cancelled."

admin:
  editor-opened: "{prefix}:book: {theme}Editor opened."
